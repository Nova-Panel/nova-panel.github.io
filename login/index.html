<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Nova Worker — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
<link rel="alternate icon" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<meta name="apple-mobile-web-app-title" content="Nova Worker" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4f6fb" />
<link rel="manifest" href="/manifest.json" />

<style>
@font-face{font-family:'Vazirmatn';src:url('/fonts/vazirmatn-var.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#f4f6fb; --card:#ffffff; --c2:#f7f9fc; --bd:#e6eaf1; --bd2:#dde2eb;
  --tx:#101622; --tx2:#445066; --mu:#8a93a6;
  --ac:#0ea5c4; --ac2:#7c3aed;
  --ac-soft:rgba(14,165,196,.10); --ac2-soft:rgba(124,58,237,.10);
  --grad:linear-gradient(120deg,#0891b2,#7c3aed);
  --ring:rgba(8,145,178,.22); --dg:#e5484d; --ok:#16a34a; --wn:#b45309;
  --shadow:0 1px 2px rgba(20,40,80,.04),0 22px 50px rgba(40,60,110,.13);
  --shadow-sm:0 1px 2px rgba(20,40,80,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px;
  font-family:'Vazirmatn','Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:var(--tx); background:var(--bg);
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(760px 420px at 14% -8%, rgba(14,165,196,.16), transparent 62%),
    radial-gradient(680px 420px at 92% 4%, rgba(124,58,237,.14), transparent 58%),
    radial-gradient(900px 520px at 50% 118%, rgba(14,165,196,.10), transparent 60%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:linear-gradient(rgba(16,22,34,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,22,34,.035) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(680px 560px at 50% 42%,#000 20%,transparent 78%);
          mask-image:radial-gradient(680px 560px at 50% 42%,#000 20%,transparent 78%);
}
.wrap{width:100%;max-width:432px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand .lg{
  width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fff,#f6f9fd);border:1px solid var(--bd);
  box-shadow:0 6px 16px rgba(40,60,110,.10),inset 0 1px 0 #fff;overflow:hidden;
}
.brand .lg img{width:32px;height:32px;object-fit:contain;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .bt strong{font-size:17px;font-weight:800;letter-spacing:-.3px}
.brand .bt small{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.4px}

/* language switch */
.lang{display:flex;gap:3px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;flex:0 0 auto;box-shadow:var(--shadow-sm)}
.lang button{
  border:none;background:transparent;color:var(--mu);font:inherit;font-size:12px;font-weight:700;
  padding:7px 12px;border-radius:9px;cursor:pointer;transition:.14s;letter-spacing:.2px;
}
.lang button:hover{color:var(--tx2)}
.lang button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(8,145,178,.28)}

/* card */
.card{
  position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;
  padding:30px 28px 24px;box-shadow:var(--shadow);overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:var(--grad);opacity:.95;
}
.head{margin-bottom:22px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ac);background:var(--ac-soft);border:1px solid rgba(14,165,196,.18);
  padding:5px 10px;border-radius:999px;margin-bottom:13px;
}
.eyebrow svg{width:13px;height:13px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.sub{margin-top:7px;font-size:13px;line-height:1.65;color:var(--tx2)}
.field{margin-top:2px}
label{display:block;font-size:12.5px;color:var(--tx2);font-weight:600;margin-bottom:8px}
.pwwrap{position:relative}
input[type=password],input[type=text]{
  width:100%;background:var(--c2);border:1px solid var(--bd2);border-radius:13px;
  padding:14px 15px;color:var(--tx);font-size:14.5px;font-family:inherit;outline:none;transition:.14s;
  padding-inline-end:50px;
}
input::placeholder{color:#a7afbf}
input:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px var(--ring)}
input:disabled{opacity:.65}
.peek{
  position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:8px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;color:var(--mu);cursor:pointer;border-radius:9px;transition:.14s;padding:0;
}
.peek:hover{color:var(--ac);background:var(--ac-soft)}
.peek svg{width:20px;height:20px;display:block}
.peek .off{display:none}
.peek.on .on{display:none}
.peek.on .off{display:block}

.err{
  display:none;align-items:flex-start;gap:7px;margin-top:12px;padding:10px 12px;border-radius:10px;
  font-size:12.5px;line-height:1.5;color:var(--dg);background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.18);
}
.err.show{display:flex}
.err svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px}

.exp{
  display:none;align-items:center;gap:10px;margin-bottom:16px;padding:11px 12px;border-radius:11px;
  font-size:12.5px;line-height:1.55;color:var(--wn);background:rgba(180,83,9,.07);border:1px solid rgba(180,83,9,.18);
}
.exp.show{display:flex}
.exp svg{width:17px;height:17px;flex:0 0 auto}
.exp div{display:flex;flex-direction:column;min-width:0}
.exp b{font-size:12.5px;font-weight:800;color:var(--wn)}
.exp span{color:var(--tx2);font-size:11.5px}
.exp .exp-n{margin-inline-start:auto;flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--wn);background:rgba(180,83,9,.1);border:1px solid rgba(180,83,9,.2)}

button.go{
  width:100%;margin-top:18px;padding:14px;border:none;border-radius:13px;
  background:var(--grad);color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 24px rgba(8,145,178,.26);transition:transform .14s,box-shadow .14s,filter .14s;
}
button.go:hover{filter:brightness(1.04);box-shadow:0 12px 28px rgba(8,145,178,.32);transform:translateY(-1px)}
button.go:active{transform:translateY(0)}
button.go:disabled{cursor:default;opacity:.85;transform:none}
button.go svg{width:18px;height:18px}
.spin{display:none;width:17px;height:17px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
button.go.loading .spin{display:block}
button.go.loading .go-ico{display:none}
@keyframes sp{to{transform:rotate(360deg)}}

.secure{
  display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;padding-top:16px;
  border-top:1px dashed var(--bd);font-size:11.5px;color:var(--mu);text-align:center;
}
.secure svg{width:14px;height:14px;flex:0 0 auto;color:var(--ok)}

.social{display:flex;gap:9px;margin-top:16px}
.social a{
  flex:1;display:flex;align-items:center;justify-content:center;height:42px;
  background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--tx2);
  text-decoration:none;transition:.15s;box-shadow:var(--shadow-sm);
}
.social a:hover{border-color:var(--bd2);color:var(--ac);transform:translateY(-1px);box-shadow:0 9px 20px rgba(40,60,110,.12)}
.social a svg{width:19px;height:19px;flex-shrink:0}
.foot{text-align:center;color:var(--mu);font-size:11.5px;margin-top:16px;line-height:1.6}

@media (max-width:460px){
  body{padding:18px 14px}
  .card{padding:26px 20px 20px;border-radius:18px}
  h1{font-size:22px}
  input[type=password],input[type=text]{font-size:16px;padding:15px;padding-inline-end:52px}
  button.go{padding:15px}
  .lang button{min-height:38px;padding:7px 10px}
  .social a{height:46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var L={
  fa:{
    kicker:'پنل مدیریت',badge:'دسترسی امن',
    title:'ورود به پنل مدیریت',sub:'برای ادامه، رمز عبور مدیر را وارد کنید.',
    label:'رمز عبور',ph:'رمز عبور خود را وارد کنید',show:'نمایش رمز',hide:'پنهان‌کردن رمز',
    go:'ورود',loading:'در حال ورود…',
    empty:'رمز عبور را وارد کنید.',bad:'رمز عبور اشتباه است. دوباره تلاش کنید.',
    net:'ارتباط با سرور برقرار نشد. اتصال خود را بررسی کنید.',
    rate:'تلاش‌های زیاد. کمی بعد دوباره امتحان کنید.',
    exp_t:'نشست شما بسته شد',exp_d:'برای امنیت، لطفاً دوباره وارد شوید.',
    secure:'محافظت‌شده توسط Cloudflare Worker شما',
    ft:'Nova Worker · Beta-0.0.1 · آبان ۱۴۰۵'
  },
  en:{
    kicker:'Control Panel',badge:'Secure access',
    title:'Sign in to the panel',sub:'Enter your admin password to continue.',
    label:'Password',ph:'Enter your password',show:'Show password',hide:'Hide password',
    go:'Sign in',loading:'Signing in…',
    empty:'Enter your password.',bad:'Wrong password. Please try again.',
    net:'Could not reach the server. Check your connection.',
    rate:'Too many attempts. Please try again later.',
    exp_t:'Your session was closed',exp_d:'For security, please sign in again.',
    secure:'Protected by your Cloudflare Worker',
    ft:'Nova Worker · Beta-0.0.1 · Aban 1405'
  },
  ru:{
    kicker:'Панель управления',badge:'Безопасный вход',
    title:'Вход в панель',sub:'Введите пароль администратора, чтобы продолжить.',
    label:'Пароль',ph:'Введите пароль',show:'Показать пароль',hide:'Скрыть пароль',
    go:'Войти',loading:'Вход…',
    empty:'Введите пароль.',bad:'Неверный пароль. Попробуйте снова.',
    net:'Не удалось связаться с сервером. Проверьте соединение.',
    rate:'Слишком много попыток. Попробуйте позже.',
    exp_t:'Сеанс закрыт',exp_d:'В целях безопасности войдите снова.',
    secure:'Защищено вашим Cloudflare Worker',
    ft:'Nova Worker · Beta-0.0.1 · Абан 1405'
  }
};
var lang='fa';
try{var sl=localStorage.getItem('nova-lang');if(sl&&L[sl])lang=sl;}catch(e){}
var $=function(id){return document.getElementById(id)};
function apply(){
  var t=L[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='fa')?'rtl':'ltr';
  document.title='Nova Worker — '+t.title;
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){
    var k=el.getAttribute('data-i18n'); if(t[k]) el.textContent=t[k];
  });
  $('pw').placeholder=t.ph;
  $('peek').setAttribute('aria-label',$('pw').type==='password'?t.show:t.hide);
  [].forEach.call(document.querySelectorAll('#lg button'),function(b){b.classList.toggle('on',b.dataset.l===lang)});
  if(erOpen) showErr(errKey);
}
var erOpen=false,errKey='';
function showErr(k){
  errKey=k;erOpen=true;
  $('er-t').textContent=L[lang][k]||L[lang].bad;
  $('er').classList.add('show');
}
function clearErr(){erOpen=false;errKey='';$('er').classList.remove('show')}

$('lg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  lang=b.dataset.l;try{localStorage.setItem('nova-lang',lang)}catch(e){}
  apply();clearErr();
});

$('peek').addEventListener('click',function(){
  var i=$('pw');var show=i.type==='password';
  i.type=show?'text':'password';
  this.classList.toggle('on',show);
  this.setAttribute('aria-label',show?L[lang].hide:L[lang].show);
  i.focus();
});

var busy=false;
function setBusy(v){
  busy=v;
  var b=$('go');
  b.disabled=v;b.classList.toggle('loading',v);
  $('go-t').textContent=v?L[lang].loading:L[lang].go;
  $('pw').disabled=v;
}

async function login(){
  if(busy)return;
  clearErr();
  var pw=$('pw').value;
  if(!pw){showErr('empty');$('pw').focus();return;}
  setBusy(true);
  try{
    var r=await fetch('/login',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'password='+encodeURIComponent(pw)
    });
    var j=null;
    try{ j=await r.json(); }catch(e){ j=null; }
    if(j && j.success===true){
      location.replace('/admin');
      return;
    }
    if(r.status===429){ showErr('rate'); }
    else { showErr('bad'); }
    $('pw').select();
  }catch(e){
    showErr('net');
  }
  setBusy(false);
}

$('form').addEventListener('submit',function(e){e.preventDefault();login();});
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();login();}});
apply();

/* session expired notice: show the error with a 3 second countdown, then allow signing in again */
(function(){
  if(!/(?:^|[?&])expired=1(?:&|$)/.test(location.search))return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  var box=$('exp'),n=$('exp-n'),left=3;
  if(n)n.textContent=left;
  if(box)box.classList.add('show');
  var timer=setInterval(function(){
    left-=1;
    if(left<=0){
      clearInterval(timer);
      if(box)box.classList.remove('show');
      try{$('pw').focus()}catch(e){}
      return;
    }
    if(n)n.textContent=left;
  },1000);
})();

</script>
